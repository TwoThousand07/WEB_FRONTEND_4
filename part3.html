<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 3 - Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assign 4</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="part1.html">Part 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="part2.html">Part 2</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part3.html">Part 3</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <h2>Part 3. Advanced Registration Form</h2>
        <hr>
        <form class="needs-validation" novalidate>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" required>
                    <div class="invalid-feedback">First name is required.</div>
                </div>
                <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" required>
                    <div class="invalid-feedback">Last name is required.</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="regEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="regEmail" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" minlength="6" required>
                    <div class="invalid-feedback">Password must be at least 6 characters long.</div>
                </div>
                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                    <div class="invalid-feedback">Please confirm your password.</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" required>
                    <label class="form-check-label" for="genderMale">Male</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="beka" required>
                    <label class="form-check-label" for="genderFemale">Female</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="genderBeka" value="female" required>
                    <label class="form-check-label" for="genderFemale">Beka</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Hobbies</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                    <label class="form-check-label" for="hobbySports">hobbi horsing</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                    <label class="form-check-label" for="hobbyReading">smotret tiktoki</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                    <label class="form-check-label" for="hobbyCoding">make AITU assignments</label>
                </div>
            </div>

            <div class="mb-4 col-md-6">
                <label for="country" class="form-label">Country</label>
                <select class="form-select" id="country" required>
                    <option selected disabled value="">Choose...</option>
                    <option value="kz">Kazakhstan</option>
                    <option value="us">Bikini Bottom</option>
                    <option value="uk">Hogwarts</option>
                </select>
                <div class="invalid-feedback">Please select a valid country.</div>
            </div>

            <button class="btn btn-success" type="submit">Submit Registration</button>
            <button class="btn btn-secondary" type="reset">Reset Form</button>
        </form>
    </div>

    <script>
        (() => {
            'use strict'
            const form = document.querySelector('.needs-validation')
            const password = document.getElementById('password')
            const confirmPassword = document.getElementById('confirmPassword')

            form.addEventListener('submit', event => {
                if (password.value !== confirmPassword.value) {
                    confirmPassword.setCustomValidity("Passwords do not match")
                } else {
                    confirmPassword.setCustomValidity("")
                }

                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })()
    </script>
</body>
</html>
