<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2 - Bootstrap Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Assign 4</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="part1.html">Part 1</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part2.html">Part 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="part3.html">Part 3</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Part 2. Bootstrap Forms & Validation</h2>
        <hr>
        <form class="needs-validation" novalidate>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="bsName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="bsName" placeholder="Enter your full name" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Please enter your name.</div>
                </div>
                <div class="col-md-6">
                    <label for="bsEmail" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="bsEmail" placeholder="name@example.com" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Please provide a valid email.</div>
                </div>
            </div>
            <div class="mb-3">
                <label for="bsMessage" class="form-label">Message</label>
                <textarea class="form-control" id="bsMessage" rows="3" placeholder="Write your message here..." required></textarea>
                <div class="invalid-feedback">Message cannot be empty.</div>
            </div>
            <button class="btn btn-primary" type="submit">Submit</button>
        </form>
    </div>

    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
